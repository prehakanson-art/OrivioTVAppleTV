name: OrivioTV
options:
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  # VENDORED with two Orivio patches (see "ORIVIO PATCH" comments): a
  # lost-wakeup fix in MEPlayerItem's reader teardown and a display-link
  # invalidation on engine swap in KSPlayerLayer — together they stop a dead
  # engine leaking ~400-500 MB per swap (jetsam killer on the 3 GB boxes).
  # Base revision: 10a40a1c0001d75307ad5922d1d1bc0cb01c89b4.
  KSPlayer:
    path: Vendor/KSPlayer
  # Pure-Swift YouTube stream extractor — the only way to play trailer
  # YouTube keys on tvOS (no WebKit/WKWebView, so no iframe embed).
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    exactVersion: 0.4.9
  # VLCKit as a binary xcframework; the tvOS slice vends module `TVVLCKit`.
  # Adds the VLC playback engine alongside KSPlayer.
  VLCKit:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: 3.6.0
targets:
  OrivioTV:
    type: application
    platform: tvOS
    sources:
      - OrivioTV
    dependencies:
      - package: KSPlayer
      - package: YouTubeKit
      - package: VLCKit
        product: VLCKitSPM
      # libdovi (quietvoid/dovi_tool's dolby_vision crate, C API) —
      # cross-compiled Rust static lib for tvOS. Powers Dolby Vision
      # Profile 7 (dual-layer) → 8.1 RPU conversion so DV7 remuxes get
      # native DV output instead of the HDR10 base-layer tone-map.
      - framework: Vendor/libdovi.xcframework
        embed: false
      # ─── Top Shelf (Continue Watching on the tvOS home screen) ───
      # ON. Needs an App Group, which needs a team that can provision one.
      # Team CYCSPZ5MTR has group.com.innerapns.pubtest.CYCSPZ5MTR (the id
      # ends in the team id, so it was issued to this team) — which is why
      # this is switched back on. AppGroupResolver reads the group from the
      # LIVE entitlement at runtime, so a re-signing tool that swaps in its
      # own group still works; if a signer strips the entitlement entirely,
      # the container is nil and the shelf stays empty without affecting
      # the app. Three spots, all marked TOP SHELF, move together.
      - target: OrivioTopShelf
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: "Orivio TV"
        # tvOS apps omit this by default, but Sideloadly's iOS-derived IPA
        # validator (Cydia Impactor lineage) rejects a bundle without it as
        # "not a valid iOS app". Harmless on tvOS (ignored); the binary stays a
        # real AppleTVOS/arm64 app and installs to the Apple TV normally.
        LSRequiresIPhoneOS: true
        # Version, from the build settings below rather than xcodegen's "1.0"/"1"
        # defaults — those literals landed in Config/Info.plist and MARKETING_VERSION
        # was never used, so About reported "Version 1.0 (1)" on every build.
        # Same place the (disabled) Top Shelf target sets its version.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIUserInterfaceStyle: Dark
        # Plus Jakarta Sans — bundled for the Stremio theme's chrome typography.
        UIAppFonts:
          - PlusJakartaSans-Regular.ttf
          - PlusJakartaSans-Medium.ttf
          - PlusJakartaSans-Bold.ttf
        # Lets canOpenURL detect external players for handoff (Infuse etc.).
        LSApplicationQueriesSchemes:
          - infuse
          - infuse-x-callback
          - vlc-x-callback
          - nplayer-http
          - open-vidhub
          # SenPlayer: converts dual-layer Dolby Vision Profile 7 to 8.1 on the
          # fly, which the Apple TV cannot decode natively — handing a P7 remux
          # to it is the alternative to this app's own libdovi conversion (see
          # PlayerSettings.dolbyVisionProfile7) or the HDR10 fallback.
          - senplayer
        # Deep links: orivio:// (open a title) + stremio:// (install an addon).
        CFBundleURLTypes:
          - CFBundleURLName: tv.orivio.deeplink
            CFBundleURLSchemes:
              - orivio
              - stremio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        # RELEASE identity — owned by this machine's Personal Team so
        # archiving/signing works straight from Xcode. The original
        # com.orivio.tv.appletv belongs to a DIFFERENT team and cannot be
        # registered here — every archive failed on it. An archive under
        # this id installs as its own app, separate from historical
        # sideloads of the original id.
        PRODUCT_BUNDLE_IDENTIFIER: com.orivio.tv.appletv.dev
        # Signing team for device builds, HERE rather than only in the
        # generated pbxproj: Xcode's GUI writes the team into project.pbxproj,
        # where any xcodegen regeneration (or a git checkout of the file)
        # silently drops it — and a device build then dies with "Signing for
        # 'OrivioTV' requires a development team".
        DEVELOPMENT_TEAM: CYCSPZ5MTR
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "3"
        # Tracks the Android APK release this port mirrors (v0.7.15-beta).
        MARKETING_VERSION: "0.7.15"
        CURRENT_PROJECT_VERSION: "1"
        # The sanitize script below writes into the built .app, so user
        # script sandboxing must be off or the phase is denied file access.
        ENABLE_USER_SCRIPT_SANDBOXING: false
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        # ─── TOP SHELF (2 of 3) ─── App group entitlement, shared with the
        # extension. Both sides must name the SAME group or the container
        # they each resolve is a different directory and the shelf is empty.
        CODE_SIGN_ENTITLEMENTS: Config/OrivioTV.entitlements
      configs:
        # DEVELOPMENT identity — used when you Run onto a real Apple TV from
        # Xcode. Building to a device REGISTERS the bundle id against your
        # team, and `com.orivio.tv.appletv` is already registered to another
        # team, so a Personal Team gets:
        #   "Failed Registering Bundle Identifier … cannot be registered to
        #    your development team because it is not available"
        # A distinct Debug id sidesteps that without touching the release
        # identity above (which the published IPAs keep, so sideloaded users
        # don't lose their data on update). It only has to be unique across
        # Apple's registry — if this one is taken too, put anything of your own
        # here. Note the dev build installs ALONGSIDE a sideloaded Orivio
        # rather than replacing it: two icons, separate local data.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.orivio.tv.appletv.dev
    postBuildScripts:
      # FFmpegKit (pulled in transitively by KSPlayer) ships
      # libshaderc_combined.framework with an underscore in its
      # CFBundleIdentifier (com.kintan.ksplayer.libshaderc_combined).
      # Underscores are illegal in a bundle id, so Xcode's product
      # validation phase rejects the embedded framework and the build
      # fails. VALIDATE_PRODUCT=NO does NOT gate this particular check,
      # and there is no build setting that disables it, so instead we
      # rewrite any offending embedded framework id to use hyphens and
      # re-sign the framework before validation runs.
      - name: "Sanitize embedded framework bundle IDs"
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          FW_DIR="${CODESIGNING_FOLDER_PATH}/Frameworks"
          [ -d "$FW_DIR" ] || exit 0
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          for fw in "$FW_DIR"/*.framework; do
            plist="$fw/Info.plist"
            [ -f "$plist" ] || continue
            bid=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist" 2>/dev/null || true)
            case "$bid" in
              *_*)
                newbid=$(printf '%s' "$bid" | tr '_' '-')
                /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $newbid" "$plist"
                codesign --force --sign "$IDENTITY" --timestamp=none "$fw"
                echo "note: sanitized bundle id $bid -> $newbid"
                ;;
            esac
          done
  # ─── TOP SHELF (3 of 3) ─── The extension target itself. Renders
  # Continue Watching on the tvOS home screen (Android's "Watch Next"
  # equivalent); reads a JSON snapshot from the shared app group written
  # by TopShelfExporter. Moves together with the other two TOP SHELF spots.
  OrivioTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - OrivioTopShelf
      - path: OrivioTV/Core/AppGroupResolver.swift
        buildPhase: sources
    info:
      path: OrivioTopShelf/Info.plist
      properties:
        CFBundleDisplayName: OrivioTV
        # From the build setting, not a literal: the app's own version keys
        # were hardcoded here once and went stale silently.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TopShelfProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orivio.tv.appletv.topshelf
        DEVELOPMENT_TEAM: CYCSPZ5MTR
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: "0.7.15"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: OrivioTopShelf/OrivioTopShelf.entitlements
      # Nested under `settings`, matching the app target above — as a direct
      # child of the target xcodegen ignores it silently and both configs keep
      # the base id.
      configs:
        # An app extension's bundle id MUST be prefixed by its host app's, and
        # the app's Debug id is the .dev one (see the note on that override).
        # Left at the release id, a Debug build fails validation with
        # "embedded binary's bundle identifier is not prefixed with the parent
        # app's".
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.orivio.tv.appletv.dev.topshelf
  # UI-test target: drives the tvOS remote (XCUIRemote) to verify focus/menu
  # behavior, which osascript keystroke automation can't do. Simulator only.
  OrivioTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - OrivioTVUITests
    dependencies:
      - target: OrivioTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orivio.tv.appletv.uitests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "3"
        TEST_TARGET_NAME: OrivioTV
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  OrivioTV:
    build:
      targets:
        OrivioTV: all
        OrivioTVUITests: [test]
    test:
      targets:
        - OrivioTVUITests
    run:
      config: Debug
      # KSPlayer's Metal renderer (MetalRender.textures) calls makeTexture and
      # tolerates a nil result via compactMap — fine on device. But the SIMULATOR
      # Debug run enables Metal API Validation, which ASSERTS (SIGABRT) on the
      # same texture instead of returning nil, crashing the app whenever a video
      # plays in the sim. Turn the validation layers off so the sim behaves like
      # the device (drop the frame, don't abort). No effect on real hardware.
      environmentVariables:
        - variable: MTL_DEBUG_LAYER
          value: "0"
          isEnabled: true
        - variable: MTL_SHADER_VALIDATION
          value: "0"
          isEnabled: true

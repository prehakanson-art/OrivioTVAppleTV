name: OrivioTV
# Profile = Release optimisation + the DEBUG launch switches, installed under the
# Debug ids (keeps the test TV's data): what to measure performance with —
# an unoptimised Debug build is several times slower in SwiftUI.
configs:
  Debug: debug
  Release: release
  Profile: release
options:
  deploymentTarget:
    # 18.0: AetherEngine (Vendor/OrivioAether) is tvOS 18+.
    tvOS: "18.0"
  createIntermediateGroups: true
packages:
  # Vendored with Orivio patches (grep "ORIVIO PATCH"). Re-apply them if re-vendored.
  KSPlayer:
    path: Vendor/KSPlayer
  # Vendored with one patch: the availability pre-check must not throw on a
  # bot-check page (VPN users lost every trailer otherwise).
  YouTubeKit:
    path: Vendor/YouTubeKit
  # Binary xcframework; the tvOS slice vends module `TVVLCKit`.
  VLCKit:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: 3.6.0
  # AetherEngine (superuser404notfound/AetherEngine) behind a DYNAMIC wrapper
  # framework. The app already links a static FFmpeg (KSPlayer's FFmpegKit)
  # and VLCKit's; AetherEngine must bind to its own AetherLib* FFmpeg, which
  # only holds when its code lives in a separate image (two-level namespace).
  # The wrapper is built with library evolution so the app never loads
  # AetherEngine's FFmpeg modules, and its manifest is where AetherEngine's
  # package traits are switched on (XcodeGen cannot pass `traits:`).
  # Needs Xcode 16.3+.
  OrivioAether:
    path: Vendor/OrivioAether
targets:
  OrivioTV:
    type: application
    platform: tvOS
    sources:
      - path: OrivioTV
        # Files from before the v0.13 restructure that the committed
        # OrivioTV.xcodeproj does not compile (their types were renamed into
        # ClassicPlayer/ and Core/*/): left out so `xcodegen generate` builds
        # the same file set as the checked-in project.
        excludes:
          - "OrivioTVApp.swift"
          - "Components/**"
          - "Core/*.swift"
          - "Core/OrivioAccount/**"
          - "Core/Plugins/**"
          - "Screens/*.swift"
          - "Theme/**"
          - "Player/AtmosHLS.swift"
          - "Player/Atomic.swift"
          - "Player/DVSampleEngine.swift"
          - "Player/DoviConverter.swift"
          - "Player/FusionPlayerControlsOverlay.swift"
          - "Player/InfuseInfoPanel.swift"
          - "Player/PlaybackDecision.swift"
          - "Player/PlayerDiagnosticsHUD.swift"
          - "Player/PlayerScreen.swift"
          - "Player/PlayerTempSweep.swift"
          - "Player/PlayerVideoView.swift"
          - "Player/ScrubberViews.swift"
          - "Player/StreamProbe.swift"
          - "Player/TrailerPlayer.swift"
          - "Player/VLCEngine.swift"
    dependencies:
      - package: KSPlayer
      - package: YouTubeKit
      - package: VLCKit
        product: VLCKitSPM
      - package: OrivioAether
        # A dynamic library: it must be copied into the app, or tvOS cannot load it.
        embed: true
      # libdovi (Rust dolby_vision crate, C API): DV Profile 7 → 8.1 RPU conversion.
      # Its headers sit in Headers/libdovi/: AetherEngine's LibDovi (module
      # `Dovi`) also copies a dovi.h and a module.modulemap into the products'
      # include/, and two files at one path fail the build.
      - framework: Vendor/libdovi.xcframework
        embed: false
      - target: OrivioTopShelf
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: "Orivio TV"
        # tvOS ignores it; Sideloadly's validator rejects the IPA without it.
        LSRequiresIPhoneOS: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIUserInterfaceStyle: Dark
        # Required or AVKit refuses to start Picture in Picture at all.
        UIBackgroundModes:
          - audio
        LSApplicationQueriesSchemes:
          - infuse
          - infuse-x-callback
          - vlc-x-callback
          - nplayer-http
          - open-vidhub
          - senplayer
        CFBundleURLTypes:
          - CFBundleURLName: tv.orivio.deeplink
            CFBundleURLSchemes:
              - orivio
              - stremio
          # Install-unique callback scheme so Infuse x-success and Top Shelf
          # links land in *this* install when several sideloads exist.
          - CFBundleURLName: tv.orivio.callback
            CFBundleURLSchemes:
              - "$(PRODUCT_BUNDLE_IDENTIFIER)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Orivio runs a small page on your network so you can add add-ons and keys from your phone."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orivio.tv.appletv.dev
        DEVELOPMENT_TEAM: CYCSPZ5MTR
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: "0.15"
        CURRENT_PROJECT_VERSION: "15"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_ENTITLEMENTS: Config/OrivioTV.entitlements
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.prestonhakanson.orivio.tv
          CODE_SIGN_ENTITLEMENTS: Config/OrivioTV-Debug.entitlements
        Profile:
          PRODUCT_BUNDLE_IDENTIFIER: com.prestonhakanson.orivio.tv
          CODE_SIGN_ENTITLEMENTS: Config/OrivioTV-Debug.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    preBuildScripts:
      # FFmpegKit ships libshaderc_combined.framework with an underscore in its
      # bundle id; embed validation rejects it. Fix it in the SPM checkout.
      - name: "Fix vendor framework bundle IDs at the source"
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          CHECKOUTS="${BUILD_DIR%/Build/Products}/SourcePackages/checkouts"
          [ -d "$CHECKOUTS" ] || exit 0
          find "$CHECKOUTS" -path "*tvos*" -name Info.plist -path "*.framework/*" \
          | while read -r plist; do
            bid=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist" 2>/dev/null || true)
            case "$bid" in
              *_*)
                chmod u+w "$plist" 2>/dev/null || true
                newbid=$(printf '%s' "$bid" | tr '_' '-')
                /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $newbid" "$plist" \
                  && echo "note: fixed checkout bundle id $bid -> $newbid" || true
                ;;
            esac
          done
    postBuildScripts:
      - name: "Sanitize embedded framework bundle IDs"
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          FW_DIR="${CODESIGNING_FOLDER_PATH}/Frameworks"
          [ -d "$FW_DIR" ] || exit 0
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          for fw in "$FW_DIR"/*.framework; do
            plist="$fw/Info.plist"
            [ -f "$plist" ] || continue
            bid=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist" 2>/dev/null || true)
            case "$bid" in
              *_*)
                newbid=$(printf '%s' "$bid" | tr '_' '-')
                /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $newbid" "$plist"
                codesign --force --sign "$IDENTITY" --timestamp=none "$fw"
                echo "note: sanitized bundle id $bid -> $newbid"
                ;;
            esac
          done
  OrivioTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - OrivioTopShelf
      - path: OrivioTV/Core/Shared/AppGroup.swift
        buildPhase: sources
      - path: OrivioTV/Core/Shared/TopShelfSnapshot.swift
        buildPhase: sources
    info:
      path: OrivioTopShelf/Info.plist
      properties:
        CFBundleDisplayName: Orivio TV
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TopShelfProvider
    settings:
      base:
        # Must stay prefixed by the app's id; moves with it.
        PRODUCT_BUNDLE_IDENTIFIER: com.orivio.tv.appletv.dev.topshelf
        DEVELOPMENT_TEAM: CYCSPZ5MTR
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: "0.15"
        CURRENT_PROJECT_VERSION: "15"
        CODE_SIGN_ENTITLEMENTS: OrivioTopShelf/OrivioTopShelf.entitlements
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.prestonhakanson.orivio.tv.topshelf
          CODE_SIGN_ENTITLEMENTS: OrivioTopShelf/OrivioTopShelf-Debug.entitlements
        Profile:
          PRODUCT_BUNDLE_IDENTIFIER: com.prestonhakanson.orivio.tv.topshelf
          CODE_SIGN_ENTITLEMENTS: OrivioTopShelf/OrivioTopShelf-Debug.entitlements
  OrivioTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - OrivioTVUITests
    dependencies:
      - target: OrivioTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orivio.tv.appletv.uitests
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "3"
        TEST_TARGET_NAME: OrivioTV
        # Signed so the remote-script test can drive a real Apple TV too.
        DEVELOPMENT_TEAM: CYCSPZ5MTR
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  OrivioTV:
    build:
      targets:
        OrivioTV: all
        OrivioTVUITests: [test]
    test:
      targets:
        - OrivioTVUITests
    run:
      config: Debug
      # KSPlayer tolerates a nil Metal texture on device; sim validation SIGABRTs on it.
      environmentVariables:
        - variable: MTL_DEBUG_LAYER
          value: "0"
          isEnabled: true
        - variable: MTL_SHADER_VALIDATION
          value: "0"
          isEnabled: true
